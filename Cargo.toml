[package]
name = "nom-teltonika"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
description = "Teltonika TCP and UDP protocol decoder and encoder with a dependency-free core"
readme = "README.md"
repository = "https://github.com/DamianoPellegrini/nom-teltonika"
license = "MIT"
keywords = ["teltonika", "avl", "gps", "tcp", "udp"]
categories = ["encoding", "network-programming", "parser-implementations"]
publish = true
include = [
    "src/**",
    "examples/**",
    "benches/**",
    "tests/*.rs",
    "tests/common/*.rs",
    "/docs/migration-0.3.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[workspace]
members = ["tools/simulator", "tools/comparison"]

[features]
default = ["std"]
alloc = ["serde?/alloc", "serde_bytes?/alloc"]
std = ["alloc", "serde?/std", "serde_bytes?/std"]
tokio = ["std", "dep:tokio"]
serde = ["dep:serde", "dep:serde_bytes"]
chrono = ["dep:chrono"]
tracing = ["std", "dep:tracing"]

[dependencies]
chrono = { version = "0.4.26", default-features = false, optional = true }
serde = { version = "1.0.171", default-features = false, optional = true, features = ["derive"] }
serde_bytes = { version = "0.11.11", default-features = false, optional = true }
tokio = { version = "1.29.1", default-features = false, optional = true, features = ["io-util", "net"] }
tracing = { version = "0.1.44", default-features = false, optional = true, features = ["std"] }

[dev-dependencies]
criterion = "0.5.1"
hex = "0.4.3"
proptest = "1"
serde_json = "1.0.102"
tokio = { version = "1.29.1", features = ["io-util", "net", "macros", "rt"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt"] }

[[example]]
name = "tcp_server"
required-features = ["std"]

[[example]]
name = "tcp_server_tokio"
required-features = ["tokio"]

[[example]]
name = "udp_server"
required-features = ["std"]

[[example]]
name = "from_buffer"
required-features = ["std"]

[[bench]]
name = "decoder"
harness = false
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
