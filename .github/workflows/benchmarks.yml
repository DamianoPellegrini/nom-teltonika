name: Informational benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install profiling tools
        run: sudo apt-get update && sudo apt-get install --yes valgrind strace time
      - run: cargo bench --bench decoder -- --output-format bencher | tee benchmark.txt
      - name: Compare with other parsers and with 0.1.6
        run: |
          cargo bench -p teltonika-comparison
          cargo run --release -p teltonika-comparison | tee comparison.md
      - name: Load test the example servers with simulated devices
        run: |
          cargo build --release --features tokio --example tcp_server_tokio --example udp_server
          cargo build --release -p teltonika-simulator
          target/release/examples/tcp_server_tokio 127.0.0.1:5000 > /dev/null &
          target/release/examples/udp_server 127.0.0.1:5001 > /dev/null &
          sleep 1
          target/release/teltonika-simulator run --server 127.0.0.1:5000 \
            --devices 500 --duration-s 30 --interval-ms 100 --records 10 --ramp-up-ms 5000 \
            | tee load-tcp.txt
          target/release/teltonika-simulator run --server 127.0.0.1:5001 --transport udp \
            --devices 500 --duration-s 30 --interval-ms 100 --records 10 --ramp-up-ms 5000 \
            | tee load-udp.txt
      - name: Record memory, allocations, and syscalls
        run: |
          cargo build --release --example from_buffer
          /usr/bin/time --verbose target/release/examples/from_buffer 2> memory.txt
          valgrind --tool=massif --massif-out-file=massif.out target/release/examples/from_buffer
          ms_print massif.out > allocations.txt
          strace --summary target/release/examples/from_buffer 2> syscalls.txt
      - uses: actions/upload-artifact@v6
        with:
          name: criterion-benchmark
          path: |
            benchmark.txt
            comparison.md
            load-tcp.txt
            load-udp.txt
            allocations.txt
            memory.txt
            syscalls.txt
            massif.out
            target/criterion
